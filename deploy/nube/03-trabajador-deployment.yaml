apiVersion: apps/v1
kind: Deployment
metadata:
  name: trabajador
  namespace: filtros
  labels:
    app: trabajador
    app.kubernetes.io/part-of: filtros
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trabajador
  template:
    metadata:
      labels:
        app: trabajador
        app.kubernetes.io/part-of: filtros
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trabajador
          # La etiqueta la sustituye aplicar.sh o el flujo de publicación;
          # nunca se usa latest.
          image: ${IMAGEN_TRABAJADOR}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: filtros-config
          env:
            - name: PUERTO
              value: "8000"
            - name: FILTROS_POR_DEFECTO
              valueFrom:
                configMapKeyRef:
                  name: filtros-config
                  key: FILTROS
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporal
              mountPath: /tmp
      volumes:
        - name: temporal
          emptyDir: {}
